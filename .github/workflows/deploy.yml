name: Build and deploy

on:
  push:
    # M1 lives on a feature branch and still needs to be viewable on a phone,
    # so the claude/** branches deploy too. Drop that line once main is live.
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Validate content
        run: npm run validate

      - name: Build
        # Taken from the repo name so the Pages base path can never drift out
        # of sync with the URL GitHub actually serves.
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repo on the first run, so nobody has to go
          # find the setting by hand.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
